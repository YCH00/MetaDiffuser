[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadiffuser-repro"
version = "0.1.0"
description = "Auditable reproduction of MetaDiffuser (ICML 2023)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
metadiffuser = "metadiffuser.cli:main"

[tool.setuptools.packages.find]
include = ["metadiffuser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

